[project]
name = "extractor-eval"
version = "0.2.0"
description = "Evaluation harness for the whimsync document parser: Docker-run tiers, page-wise gold, deterministic + Gemini judge scoring, and a results UI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "google-genai>=1.0.0",
    "markdown-it-py>=3.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.3.0",
    "pydantic>=2.7",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.1",
    "rapidfuzz>=3.9",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
extractor-eval = "extractor_eval.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0.0",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extractor_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
