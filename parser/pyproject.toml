[project]
name = "whimsync-parser-evals"
version = "0.1.0"
description = "Synthetic-ground-truth benchmark for the whimsync document parser tiers"
requires-python = ">=3.11"
dependencies = [
    # Code under test: the sibling whimsync checkout's extractor (editable, so local
    # changes there are benchmarked without reinstalling).
    "whimsync-extractor",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.3.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.uv]
# Installed (editable) so `python -m bench.*` works from any directory.
package = true

[tool.uv.sources]
whimsync-extractor = { path = "../../whimsync/apps/extractor", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
